[package]
name = "hydra-desktop"
version = "1.2.2"
edition = "2021"
description = "Hydra Desktop: native Rust port of the Hydra web desk. No browser, no web view, no localhost."
license = "MIT"

[lib]
name = "hydra_desktop"
path = "src/lib.rs"

[[bin]]
name = "Hydra"
path = "src/main.rs"

[dependencies]
hydra-stdio = { path = "../hydra-stdio" }
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe"] }
